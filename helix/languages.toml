[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[[language]]
name = "python"
language-servers = ["pyright", "ruff"]
auto-format = true

[language-server.taplo]
command = "taplo"
args = ["lsp", "stdio"]

[[language]]
name = "toml"
language-servers = ["taplo"]
auto-format = true
soft-wrap.enable = true

[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

[[language]]
name = "markdown"
language-servers = ["harper-ls"]
soft-wrap.enable = true

[language-server.matlab-language-server]
command = "matlab-language-server"
args = ["--stdio"]

# Settings must nest under config.MATLAB, not config — a flat block makes the
# server crash on init when Helix answers the workspace-configuration request.
[language-server.matlab-language-server.config.MATLAB]
installPath = "/usr/local/MATLAB/R2026a"
matlabConnectionTiming = "onStart"
indexWorkspace = true
telemetry = false

[[language]]
name = "matlab"
language-servers = ["matlab-language-server"]
