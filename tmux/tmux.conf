# Mouse support
set -g mouse on

# Use vi keys in copy mode
set-window-option -g mode-keys vi

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Faster key repetition
set -s escape-time 0

# Increase scrollback buffer
set -g history-limit 10000

# -------------------------------------------------------------------
# Prefix-free pane navigation (Alt + hjkl)
# -------------------------------------------------------------------
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Prefix-free pane resizing (Alt + Shift + hjkl)
bind -n M-H resize-pane -L 1
bind -n M-J resize-pane -D 1
bind -n M-K resize-pane -U 1
bind -n M-L resize-pane -R 1

# Prefix-free window switching (Alt + number)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Prefix-free window navigation (Alt + n/p)
bind -n M-n next-window
bind -n M-p previous-window

# Prefix-free splits (Alt + | and Alt + -)
bind -n M-| split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# Prefix-free new window (Alt + t)
bind -n M-t new-window -c "#{pane_current_path}"

# Prefix-free close pane (Alt + x)
bind -n M-x kill-pane

# Vi-style copy mode bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
